name: Optimize cerc copii adapost (one-time)
on:
  push:
    paths:
      - ".github/workflows/optimize-cerc-copii-adapost.yml"
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create optimized WebP, retain source PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Path("propunere-activitati/media/cerc-copii-adapost.png")
          dst=Path("propunere-activitati/media/cerc-copii-adapost.webp")
          image=ImageOps.exif_transpose(Image.open(src)).convert("RGB")
          print("Original dimensions:", image.size)
          max_width=1200
          if image.width>max_width:
              image=image.resize((max_width,round(image.height*max_width/image.width)),Image.Resampling.LANCZOS)
          image.save(dst,"WEBP",quality=82,method=6)
          print(f"{src.stat().st_size:,} -> {dst.stat().st_size:,} bytes",image.size)
          PY
      - name: Commit optimized version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add propunere-activitati/media/cerc-copii-adapost.webp
          git diff --cached --quiet || (git commit -m "Add optimized cerc-copii-adapost WebP" && git push)
