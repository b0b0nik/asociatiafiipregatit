name: Optimize patch logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-site-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Optimize patch PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          p="LOGO-PATCH.png"
          with Image.open(p) as im:
              im=ImageOps.exif_transpose(im)
              if max(im.size)>512:
                  im.thumbnail((512,512), Image.Resampling.LANCZOS)
              im.save(p,"PNG",optimize=True,compress_level=9)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LOGO-PATCH.png
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Optimize patch logo for web [skip ci]"
            git push
          fi
