name: Optimize IMG 7435 (one-time)
on:
  push:
    paths:
      - ".github/workflows/optimize-img7435.yml"
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optimize existing photograph without changing its contents
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Path("assets/imagini-homepage/IMG_7435.jpg")
          dst = Path("assets/imagini-homepage/IMG_7435.webp")
          im = ImageOps.exif_transpose(Image.open(src)).convert("RGB")
          max_w = 1600
          if im.width > max_w:
              im = im.resize((max_w, round(im.height * max_w / im.width)), Image.Resampling.LANCZOS)
          im.save(dst, "WEBP", quality=82, method=6)
          print(f"Optimized: {src.stat().st_size:,} -> {dst.stat().st_size:,} bytes | {im.width}x{im.height}")
          PY
      - name: Commit optimized image while retaining original
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imagini-homepage/IMG_7435.webp
          git diff --cached --quiet || (git commit -m "Add optimized IMG 7435 WebP for both heroes" && git push)
