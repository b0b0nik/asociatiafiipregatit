name: Optimize hero images (one-time)
on:
  push:
    paths:
      - ".github/workflows/optimize-hero-images.yml"
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create optimized WebP versions without altering source photographs
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          files = [
              ("assets/imagini-homepage/cori-lau-copiicerc.jpg", "assets/imagini-homepage/cori-lau-copiicerc.webp", 1600),
              ("propunere-activitati/media/cerc-ubuntu.jpeg", "propunere-activitati/media/cerc-ubuntu.webp", 1920),
          ]
          for original, target, max_width in files:
              image = ImageOps.exif_transpose(Image.open(original)).convert("RGB")
              if image.width > max_width:
                  height = round(image.height * max_width / image.width)
                  image = image.resize((max_width, height), Image.Resampling.LANCZOS)
              image.save(target, "WEBP", quality=82, method=6)
              before = Path(original).stat().st_size
              after = Path(target).stat().st_size
              print(f"{original} {before:,} -> {target} {after:,} bytes; {image.size}")
          PY
      - name: Commit new optimized versions (keep JPEG originals)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imagini-homepage/cori-lau-copiicerc.webp propunere-activitati/media/cerc-ubuntu.webp
          git diff --cached --quiet || (git commit -m "Add optimized WebP versions of hero photos" && git push)
