name: Optimize OG images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-og-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize Open Graph images
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          paths = [
              "og-homepage-fii-pregatit-brasov.JPG",
              "og-inscriere-fii-pregatit.JPG",
              "og-scoala-altfel-saptamana-verde-brasov.JPG",
          ]
          for path in paths:
              with Image.open(path) as im:
                  im = ImageOps.fit(
                      im.convert("RGB"),
                      (1200, 630),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5, 0.5),
                  )
                  im.save(
                      path,
                      "JPEG",
                      quality=82,
                      optimize=True,
                      progressive=True,
                      subsampling=1,
                  )
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-homepage-fii-pregatit-brasov.JPG og-inscriere-fii-pregatit.JPG og-scoala-altfel-saptamana-verde-brasov.JPG
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Optimize OG images for social previews [skip ci]"
            git push
          fi
